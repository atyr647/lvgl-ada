name = "lvgl_ada"
description = "Thin Ada binding to LVGL v9 (core + Sentinel's Phase 8 widget set)"
version = "9.6.0-dev"
licenses = "MIT"
maintainers = ["Fabien Chouteau <fabien.chouteau@gmail.com>"]
maintainers-logins = ["Fabien-Chouteau"]
authors = ["Fabien Chouteau <fabien.chouteau@gmail.com>"]

website = "https://github.com/atyr647/lvgl-ada"
tags = ["embedded", "gui", "lvgl"]

# v9.6.0's configuration is a single committed lv_conf.h at the repo
# root (standard LVGL practice), not Alire [configuration.variables] --
# v9's config surface (lv_conf_template.h) doesn't map onto the old
# Pixel_Bit_Depth/Virtual_Display_Buffer_Size-style variables this crate
# used for the v5/v6 binding; several of those (the virtual display
# buffer) are v5/v6-only concepts that don't exist in v9 at all. Edit
# lv_conf.h directly, or point LV_CONF_PATH at your own, to change
# settings.

[[depends-on]]
libsdl2 = "*"

[gpr-externals]
LIBRARY_TYPE = ["static", "relocatable", "static-pic"]

[gpr-set-externals]
LIBRARY_TYPE = "static"
